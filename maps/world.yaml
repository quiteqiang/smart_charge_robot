# 解析世界模型：与 maps/site.pgm 严格同源（scripts/generate_map.py 的几何一致）。
# 仿真器直接读取本文件做射线投射，map_server 读取 pgm；两者必须保持一致。
walls:
  - {xmin: 0.0, ymin: 0.0, xmax: 20.0, ymax: 0.2}
  - {xmin: 0.0, ymin: 19.8, xmax: 20.0, ymax: 20.0}
  - {xmin: 0.0, ymin: 0.0, xmax: 0.2, ymax: 20.0}
  - {xmin: 19.8, ymin: 0.0, xmax: 20.0, ymax: 20.0}
obstacles:
  - {xmin: 6.0, ymin: 2.0, xmax: 7.0, ymax: 6.0}     # box A
  - {xmin: 9.0, ymin: 10.0, xmax: 10.0, ymax: 13.0}  # box B
  - {xmin: 4.0, ymin: 12.0, xmax: 5.0, ymax: 14.0}   # box C
pillars:
  - {x: 12.0, y: 8.0, r: 0.5}                        # pillar D
# 充电桩贴西墙安装，零占地（与 pgm 一致）
dock_pose: {x: 1.2, y: 17.0, yaw: 3.1416}   # 机器人泊靠完成时的朝向（面向 -x / 充电桩）
start_pose: {x: 1.0, y: 1.0, yaw: 0.0}
